<section [class.hero-compacto]="!showButton()" class="hero-container" [style.--images] = "'url(' + imageUrl() +')'">
  <div class="hero-content">
    <h1 class="hero-title">{{title()}}</h1>
    <p class="hero-description">{{description()}}</p>
    @if(showButton()){
      <app-button label="Explorar colección" class="hero-cta"/>
    }



  </div>
</section>
